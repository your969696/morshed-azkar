      background: linear-gradient(145deg,#0d2818,#1a3a2a,#0d1b2a);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      animation: dwIn .35s ease,dwGlow 3s ease infinite;

    .badge { display:none; }
    .category{ display:none; }

      max-height: 100px; overflow-y: auto;

      transition: opacity 0.4s ease;
    }
    .dhikr-text::-webkit-scrollbar{width:4px}
    .dhikr-text::-webkit-scrollbar-thumb{background:rgba(0,200,150,.25);border-radius:4px}
    .dhikr-text.fade { opacity: 0; }
    .source{display:none}
    .hint{display:none}
    .close-btn {
      position: absolute; top: 4px; left: 4px;

      background: rgba(255,255,255,0.08); border: none;
      color: rgba(255,255,255,0.4); font-size: 12px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      -webkit-app-region: no-drag; transition: all 0.15s; z-index: 10;
    }
    .close-btn:hover { background: rgba(239,68,68,0.3); color: #f87171; }
    .progress {
      position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
      background: rgba(255,255,255,0.03); border-radius: 0 0 16px 16px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 0 0 16px 16px;

          {text:'التواضع — قال ﷺ: ما تواضع أحد لله إلا رفعه الله.',source:'صحيح مسلم',category:'أخلاق'},
          {text:'حب الخير للغير — قال ﷺ: لا يُؤمِنُ أحدُكم حتّى يُحِبَّ لأخيهِ ما يُحِبُّ لنفسِهِ.',source:'صحيح البخاري ومسلم',category:'أخلاق'},
          {text:'شكر النعمة — قال ﷺ: لا يُشكِرُ اللهَ من لا يُشكِرُ الناسَ.',source:'سنن أبي داود',category:'أخلاق'},
          {text:'إفشاء العلم — قال ﷺ: خيركم من تعلم القرآن وعلمه.',source:'صحيح البخاري',category:'علم'},
          {text:'الاستمرار على الطاعات — قال ﷺ: أحَبُّ الأعمالِ إلى اللهِ أدومُها وإن قَلَّ.',source:'صحيح البخاري ومسلم',category:'أخلاق'},
        ]
      }
    ];

    var SHOW_MS = 20000;
    var DHIKR_INTERVAL = 20000;
    var idx = -1;
    var ticks = 0;
    var el = document.getElementById('dhikrText');
    var badgeEmoji = document.getElementById('badgeEmoji');
    var badgeLabel = document.getElementById('badgeLabel');
    var catEl = document.getElementById('category');
    var srcEl = document.getElementById('source');
    var progressEl = document.getElementById('progress');

    var allItems = [];
    SOURCES.forEach(function(src) {
      src.items.forEach(function(item) {
        allItems.push({text: item.text, source: item.source, category: item.category, emoji: src.emoji, label: src.label});
      });
    });

    function showNext() {
      el.classList.add('fade');
      setTimeout(function() {
        idx = (idx + 1) % allItems.length;
        if (idx === 0) {
          for (var i = allItems.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = allItems[i];
            allItems[i] = allItems[j];
            allItems[j] = temp;
          }
        }
        var item = allItems[idx];
        el.textContent = item.text;
        badgeEmoji.textContent = item.emoji;
        badgeLabel.textContent = item.label;
        catEl.textContent = item.category;
        srcEl.textContent = item.source;
        el.classList.remove('fade');
      }, 350);
      ticks = 0;
    }

    setInterval(function() {
      ticks++;
      progressEl.style.width = Math.max(0, 100 - (ticks / (SHOW_MS / 1000)) * 100) + '%';
    }, 1000);

    setInterval(function() { showNext(); }, DHIKR_INTERVAL);

    showNext();

    document.getElementById('closeBtn').addEventListener('click', function(e) {
      e.stopPropagation();
      showNext();
      if (window.electronAPI && window.electronAPI.dodgeAzkarWidget) {
        window.electronAPI.dodgeAzkarWidget();
      }
    });

    var dodgeActive = false;
    var dodgeTimer = null;
    var MOUSE_DODGE = 100;
    var hoveringClose = false;

    document.getElementById('closeBtn').addEventListener('mouseenter', function() { hoveringClose = true; });
    document.getElementById('closeBtn').addEventListener('mouseleave', function() { hoveringClose = false; });

    document.addEventListener('mousemove', function(e) {
      if (dodgeActive || hoveringClose) return;
      var mx = e.screenX;
      var my = e.screenY;
      var wx = window.screenX;
      var wy = window.screenY;
      var ww = window.outerWidth;
      var wh = window.outerHeight;
      var near = mx >= wx - MOUSE_DODGE && mx <= wx + ww + MOUSE_DODGE &&
                 my >= wy - MOUSE_DODGE && my <= wy + wh + MOUSE_DODGE;
      if (near) {
        dodgeActive = true;
        if (window.electronAPI && window.electronAPI.dodgeAzkarWidget) {
          window.electronAPI.dodgeAzkarWidget(mx, my);
        }
        if (dodgeTimer) clearTimeout(dodgeTimer);
        dodgeTimer = setTimeout(function() { dodgeActive = false; }, 800);
      }
    });
  </script>
</body>
</html>
