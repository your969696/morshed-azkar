<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عداد الصلاة</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  width:100vw; height:100vh; overflow:hidden;
  background:linear-gradient(135deg, #080012 0%, #120820 40%, #08100a 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
  color:#fff; user-select:none;
  border:1.5px solid rgba(212,175,55,.35);
  border-radius:16px;
}

/* ── Background glows ── */
.bg-glow-gold {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  width:320px; height:320px; border-radius:50%;
  background:radial-gradient(circle, rgba(212,175,55,.07) 0%, transparent 70%);
  pointer-events:none; animation:breathe 3s ease infinite;
}
.bg-glow-green {
  position:fixed; bottom:-80px; left:50%; transform:translateX(-50%);
  width:200px; height:200px; border-radius:50%;
  background:radial-gradient(circle, rgba(0,200,150,.05) 0%, transparent 70%);
  pointer-events:none;
}
@keyframes breathe { 0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)} 50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)} }

/* ── Top accent line ── */
.top-line {
  position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, rgba(212,175,55,.6), #ffd700, rgba(212,175,55,.6), transparent);
}

/* ── Pulse rings ── */
.pulse-ring {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  border:1px solid rgba(212,175,55,.1);
  border-radius:50%; pointer-events:none;
}
.pr1 { width:180px; height:180px; animation:pulseRing 2.5s ease-out infinite; }
.pr2 { width:260px; height:260px; animation:pulseRing 2.5s ease-out .8s infinite; }
.pr3 { width:340px; height:340px; animation:pulseRing 2.5s ease-out 1.6s infinite; }
@keyframes pulseRing {
  0%   { transform:translate(-50%,-50%) scale(.85); opacity:.5; }
  100% { transform:translate(-50%,-50%) scale(1.3); opacity:0; }
}

/* ── Content ── */
.content {
  position:relative; z-index:10;
  display:flex; flex-direction:column; align-items:center;
}

.bismillah {
  font-size:13px; color:rgba(212,175,55,.65);
  margin-bottom:10px; letter-spacing:.5px;
  font-family:'Traditional Arabic','Amiri',serif;
}

.prayer-name {
  font-size:30px; font-weight:800; color:#d4af37;
  text-shadow:0 0 25px rgba(212,175,55,.4);
  margin-bottom:4px;
  animation:nameGlow 2s ease infinite;
}
@keyframes nameGlow {
  0%,100%{ text-shadow:0 0 10px rgba(212,175,55,.3); }
  50%    { text-shadow:0 0 30px rgba(212,175,55,.7), 0 0 60px rgba(212,175,55,.2); }
}

.prayer-time {
  font-size:18px; color:rgba(255,255,255,.65);
  margin-bottom:18px; letter-spacing:3px;
  direction:ltr; font-variant-numeric:tabular-nums;
}

/* Divider */
.divider {
  width:50px; height:1.5px; border-radius:1px;
  background:linear-gradient(90deg, transparent, rgba(212,175,55,.4), transparent);
  margin-bottom:18px;
}

/* ── Countdown display ── */
.countdown-wrap {
  display:flex; align-items:center; gap:8px;
  direction:ltr; margin-bottom:16px;
}
.cd-unit {
  display:flex; flex-direction:column; align-items:center;
}
.cd-box {
  background:rgba(212,175,55,.07);
  border:1px solid rgba(212,175,55,.22);
  border-radius:14px; padding:12px 18px;
  min-width:72px; text-align:center;
  position:relative; overflow:hidden;
  backdrop-filter:blur(4px);
}
.cd-box::before {
  content:'';
  position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(212,175,55,.3), transparent);
}
.cd-num {
  font-size:36px; font-weight:900;
  color:#d4af37;
  font-variant-numeric:tabular-nums; direction:ltr;
  line-height:1; letter-spacing:1px;
  text-shadow:0 0 20px rgba(212,175,55,.4);
  transition:all .15s ease;
}
.cd-num.flip {
  animation:flipNum .15s ease;
}
@keyframes flipNum {
  0%  { transform:translateY(-8px); opacity:.5; }
  100%{ transform:translateY(0);    opacity:1; }
}
.cd-label {
  font-size:10px; color:rgba(255,255,255,.35);
  margin-top:5px; font-weight:600; letter-spacing:.5px;
}
.cd-sep {
  font-size:28px; font-weight:900; color:rgba(212,175,55,.4);
  margin-bottom:18px; line-height:1;
  animation:blink 1s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:.4} 50%{opacity:.9} }

/* ── Sound wave visualizer ── */
.viz {
  display:flex; align-items:flex-end; gap:3px;
  height:24px; margin-bottom:14px; justify-content:center;
}
.vbar {
  width:3px; border-radius:3px;
  background:linear-gradient(to top, #d4af37, rgba(212,175,55,.3));
  min-height:3px; transition:height .1s ease;
  animation:waveBar .8s ease infinite;
}
@keyframes waveBar { 0%,100%{transform:scaleY(.3)} 50%{transform:scaleY(1)} }

/* ── Status message ── */
.status-msg {
  font-size:13px; color:rgba(255,255,255,.5);
  text-align:center; line-height:1.6;
  padding:0 16px;
}
.status-msg b { color:#d4af37; font-weight:700; }

/* ── Progress bar ── */
.prog-wrap {
  position:fixed; bottom:0; left:0; right:0;
  height:3px; background:rgba(255,255,255,.06);
}
.prog-fill {
  height:100%;
  background:linear-gradient(90deg, #d4af37, #ffd700);
  transition:width 1s linear;
}

/* ── Hint ── */
.hint {
  position:fixed; bottom:10px; right:12px;
  font-size:10px; color:rgba(255,255,255,.2);
}

/* ── Prayer time arrived ── */
body.arrived {
  border-color:rgba(0,200,150,.4);
  background:linear-gradient(135deg, #050a08 0%, #0a1a12 40%, #050a08 100%);
}
body.arrived .prayer-name { color:#00c896; }
body.arrived .cd-num { color:#00c896; text-shadow:0 0 20px rgba(0,200,150,.4); }
body.arrived .cd-box { background:rgba(0,200,150,.07); border-color:rgba(0,200,150,.22); }
body.arrived .bg-glow-gold {
  background:radial-gradient(circle, rgba(0,200,150,.08) 0%, transparent 70%);
}
</style>
</head>
<body>

<div class="top-line"></div>
<div class="bg-glow-gold"></div>
<div class="bg-glow-green"></div>
<div class="pulse-ring pr1"></div>
<div class="pulse-ring pr2"></div>
<div class="pulse-ring pr3"></div>

<div class="content">
  <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
  <div class="prayer-name" id="prayerName">🕌 الصلاة قادمة</div>
  <div class="prayer-time"  id="prayerTime">--:--</div>
  <div class="divider"></div>

  <!-- Sound wave viz (أنيميشن بس — مش متصل بصوت حقيقي) -->
  <div class="viz" id="viz">
    <div class="vbar" style="height:6px; animation-delay:.0s"></div>
    <div class="vbar" style="height:14px;animation-delay:.1s"></div>
    <div class="vbar" style="height:20px;animation-delay:.2s"></div>
    <div class="vbar" style="height:16px;animation-delay:.3s"></div>
    <div class="vbar" style="height:10px;animation-delay:.4s"></div>
    <div class="vbar" style="height:18px;animation-delay:.5s"></div>
    <div class="vbar" style="height:22px;animation-delay:.6s"></div>
    <div class="vbar" style="height:14px;animation-delay:.7s"></div>
    <div class="vbar" style="height:8px; animation-delay:.8s"></div>
  </div>

  <div class="countdown-wrap">
    <div class="cd-unit">
      <div class="cd-box"><div class="cd-num" id="cdMins">01</div></div>
      <div class="cd-label">دقيقة</div>
    </div>
    <div class="cd-sep">:</div>
    <div class="cd-unit">
      <div class="cd-box"><div class="cd-num" id="cdSecs">00</div></div>
      <div class="cd-label">ثانية</div>
    </div>
  </div>

  <div class="status-msg" id="statusMsg">
    استعد للصلاة — <b>الأذان بعد قليل</b>
  </div>
</div>

<div class="prog-wrap">
  <div class="prog-fill" id="progFill" style="width:0%"></div>
</div>
<div class="hint">اضغط للإغلاق</div>

<script>
// ── State ─────────────────────────────────────────────────────
let targetSec = 0;
let dataReceived = false;
let audioCtx = null;
let lastBeepSec = -1;
let totalDuration = 60; // الوقت الكلي للعداد (ثانية)
let startSec = -1;      // الثانية اللي بدأ فيها العداد

// ── Audio Context ─────────────────────────────────────────────
function initAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch {}
}

// ── Beep — تدريجي (يبدأ خفيف ويزيد مع اقتراب الأذان) ─────────
function playBeep(secondsLeft) {
  if (!audioCtx) initAudio();
  if (!audioCtx) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    // تردد وحجم يزيد كلما اقتربنا من الأذان
    const ratio    = Math.max(0, Math.min(1, 1 - secondsLeft / 60));
    const freq     = 600 + ratio * 600;   // 600Hz → 1200Hz
    const volume   = 0.08 + ratio * 0.15; // 0.08 → 0.23
    const duration = 0.06 + ratio * 0.06; // 60ms → 120ms

    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + duration);
  } catch {}
}

// ── Final beep (عند 0) — أطول وأعلى ─────────────────────────
function playFinalBeep() {
  if (!audioCtx) initAudio();
  if (!audioCtx) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    // 3 نغمات متتالية
    [0, 0.18, 0.36].forEach((delay, i) => {
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 800 + i * 200;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.25);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + 0.25);
    });
  } catch {}
}

// ── Flip animation ────────────────────────────────────────────
function flipNum(el, val) {
  const str = String(val).padStart(2, '0');
  if (el.textContent !== str) {
    el.classList.remove('flip');
    void el.offsetWidth; // reflow
    el.classList.add('flip');
    el.textContent = str;
  }
}

// ── Update countdown ──────────────────────────────────────────
function updateCountdown() {
  if (targetSec <= 0) return;

  const now    = new Date();
  const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  let diff     = targetSec - nowSec;
  if (diff < 0) diff = 0;

  const mins = Math.floor(diff / 60);
  const secs = diff % 60;

  flipNum(document.getElementById('cdMins'), mins);
  flipNum(document.getElementById('cdSecs'), secs);

  // Progress bar
  if (startSec < 0) startSec = nowSec;
  const elapsed = nowSec - startSec;
  const pct     = Math.min(100, (elapsed / totalDuration) * 100);
  document.getElementById('progFill').style.width = pct + '%';

  // ── Beep كل ثانية (بدون تكرار في نفس الثانية) ────────────
  if (diff > 0 && diff <= 60 && secs !== lastBeepSec) {
    lastBeepSec = secs;
    playBeep(diff);
  }

  // ── Status message يتغير مع الوقت ─────────────────────────
  const msg = document.getElementById('statusMsg');
  if (diff > 30) {
    msg.innerHTML = 'استعد للصلاة — <b>الأذان بعد قليل</b>';
  } else if (diff > 10) {
    msg.innerHTML = '🤲 توضأ وتهيأ — <b>الأذان قريب جداً</b>';
  } else if (diff > 0) {
    msg.innerHTML = '🕌 <b>الأذان الآن!</b>';
  }

  // ── عند الصفر: حان وقت الأذان ────────────────────────────
  if (diff === 0 && lastBeepSec !== -99) {
    lastBeepSec = -99; // منع التكرار
    playFinalBeep();
    document.body.classList.add('arrived');
    document.getElementById('prayerName').textContent = '🕌 حان وقت الصلاة!';
    document.getElementById('cdMins').textContent = '00';
    document.getElementById('cdSecs').textContent = '00';
    msg.innerHTML = '🌙 <b>الله أكبر — الصلاة خير من النوم</b>';
    document.getElementById('progFill').style.width = '100%';

    // أغلق النافذة فوراً
    window.electronAPI?.hideCountdownWindow?.();
  }
}

// ── Receive data ──────────────────────────────────────────────
window.electronAPI?.onCountdownData?.((data) => {
  dataReceived = true;
  if (data.prayerTime)   document.getElementById('prayerTime').textContent  = data.prayerTime;
  if (data.prayerNameAr) document.getElementById('prayerName').textContent = '🕌 ' + data.prayerNameAr;

  if (data.targetSec && data.targetSec !== 0) {
    targetSec = data.targetSec;
  } else {
    const ts = (data.prayerTime || '').replace(/\s*\(.*?\)\s*/g, '').trim();
    const m  = ts.match(/(\d{1,2}):(\d{2})/);
    if (m) targetSec = parseInt(m[1], 10) * 3600 + parseInt(m[2], 10) * 60;
  }

  // حجم البيب التلقائي
  if (data.playBeep) {
    initAudio();
    setTimeout(() => playBeep(60), 300); // أول بيب بعد 300ms
  }

  updateCountdown();
});

// ── Timer ─────────────────────────────────────────────────────
setInterval(updateCountdown, 1000);

// ── Close ─────────────────────────────────────────────────────
document.body.addEventListener('click', () => {
  initAudio();
  window.electronAPI?.hideCountdownWindow?.();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') window.electronAPI?.hideCountdownWindow?.();
});
</script>
</body>
</html>
