<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة الإعداد - Onboarding Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d4a853;
    --gold-light: #f0d78c;
    --gold-dim: rgba(212,168,83,0.15);
    --teal: #5ba4a4;
    --teal-light: #8ec8c8;
    --teal-dim: rgba(91,164,164,0.12);
    --bg-deep: #07070c;
    --bg-card: rgba(255,255,255,0.04);
    --bg-card-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.06);
    --border-active: rgba(212,168,83,0.4);
    --text: #f0ece4;
    --text-muted: #7a7570;
    --text-dim: #4a4744;
    --radius: 16px;
    --radius-sm: 10px;
    --radius-xs: 6px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Background Effects */
  .bg-gradient { position: fixed; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(212,168,83,0.06) 0%, transparent 60%), radial-gradient(ellipse 60% 50% at 80% 80%, rgba(91,164,164,0.04) 0%, transparent 50%), radial-gradient(ellipse 50% 40% at 10% 60%, rgba(212,168,83,0.03) 0%, transparent 50%); pointer-events: none; }
  .bg-orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; }
  .bg-orb-1 { width: 400px; height: 400px; top: -100px; right: -100px; background: rgba(212,168,83,0.06); animation: orbFloat 20s ease-in-out infinite; }
  .bg-orb-2 { width: 300px; height: 300px; bottom: -80px; left: -80px; background: rgba(91,164,164,0.05); animation: orbFloat 25s ease-in-out infinite reverse; }
  @keyframes orbFloat { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(30px, -20px) scale(1.05); } 66% { transform: translate(-20px, 15px) scale(0.95); } }

  /* Geometric Pattern */
  .pattern-wrap { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .pattern-svg { width: 100%; height: 100%; color: var(--gold); opacity: 0.4; }

  /* Floating Particles */
  .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .particle { position: absolute; border-radius: 50%; background: var(--gold); animation: particleFloat linear infinite; }
  @keyframes particleFloat { 0% { transform: translateY(0) translateX(0); opacity: var(--p-opacity); } 50% { transform: translateY(-40px) translateX(20px); opacity: calc(var(--p-opacity) * 2); } 100% { transform: translateY(0) translateX(0); opacity: var(--p-opacity); } }

  /* Container */
  .container { position: relative; z-index: 10; width: 100%; max-width: 440px; height: 100vh; display: flex; flex-direction: column; }

  /* Steps */
  .step { flex: 1; display: none; flex-direction: column; overflow-y: auto; overflow-x: hidden; padding: 16px 24px; scrollbar-width: none; animation: stepIn 0.5s ease; }
  .step::-webkit-scrollbar { display: none; }
  .step.active { display: flex; }
  @keyframes stepIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

  /* Welcome */
  .welcome { align-items: center; justify-content: center; text-align: center; }
  .welcome-content { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .welcome-crescent { margin-bottom: 4px; filter: drop-shadow(0 0 30px rgba(212,168,83,0.3)); animation: fadeInUp 1s ease 0.2s both; }
  .title { font-family: 'Amiri Quran', serif; font-size: 2.2rem; font-weight: 700; color: var(--gold); letter-spacing: 0.02em; line-height: 1.3; text-shadow: 0 0 40px rgba(212,168,83,0.2); animation: fadeInUp 0.8s ease 0.5s both; }
  .subtitle { font-size: 1.1rem; font-weight: 600; color: var(--text); letter-spacing: 0.04em; animation: fadeInUp 0.8s ease 0.8s both; }
  .desc { font-size: 0.82rem; color: var(--text-muted); max-width: 280px; line-height: 1.6; animation: fadeInUp 0.8s ease 1.1s both; }
  .version { font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.1em; animation: fadeIn 0.8s ease 2s both; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 0.4; } }

  /* Divider */
  .divider { display: flex; align-items: center; gap: 12px; width: 120px; margin: 4px 0; animation: fadeIn 0.8s ease 0.3s both; }
  .divider-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .divider-diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); opacity: 0.6; }

  /* Step Header */
  .step-header { display: flex; align-items: center; justify-content: space-between; padding-top: 4px; margin-bottom: 12px; min-height: 36px; }
  .back-btn { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
  .back-btn:hover { color: var(--text); background: var(--bg-card-hover); border-color: rgba(255,255,255,0.1); }
  .step-indicator { display: flex; align-items: center; }
  .step-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; transition: all 0.4s; }
  .step-dot.active { border-color: var(--gold); background: var(--gold-dim); }
  .step-dot.completed { border-color: var(--teal); background: var(--teal-dim); color: var(--teal); }
  .step-line { width: 48px; height: 2px; background: var(--border); transition: background 0.4s; }
  .step-line.filled { background: linear-gradient(90deg, var(--teal), var(--gold)); }

  /* Step Content */
  .step-content { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .step-icon-wrap { margin-bottom: 8px; }
  .icon-circle { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--border-active); background: var(--gold-dim); display: flex; align-items: center; justify-content: center; }
  .icon-circle.teal { border-color: rgba(91,164,164,0.3); background: var(--teal-dim); }
  .step-title { font-family: 'Amiri Quran', serif; font-size: 1.4rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .step-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px; }

  /* Language Cards */
  .lang-grid { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
  .lang-card { position: relative; background: var(--bg-card); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px 20px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); overflow: hidden; }
  .lang-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(212,168,83,0.08), transparent); opacity: 0; transition: opacity 0.3s; }
  .lang-card:hover::before { opacity: 1; }
  .lang-card:hover { border-color: rgba(255,255,255,0.1); background: var(--bg-card-hover); }
  .lang-card.active { border-color: var(--gold); background: rgba(212,168,83,0.06); }
  .lang-card.active::before { opacity: 1; }
  .lang-native { font-size: 1.15rem; font-weight: 600; color: var(--text); }
  .lang-sub { font-size: 0.78rem; color: var(--text-muted); font-weight: 400; }
  .lang-check { position: absolute; top: 12px; left: 12px; width: 24px; height: 24px; background: var(--gold); border-radius: 50%; display: none; align-items: center; justify-content: center; animation: checkPop 0.3s ease; }
  .lang-card.active .lang-check { display: flex; }
  @keyframes checkPop { from { transform: scale(0); } to { transform: scale(1); } }

  /* Location Mode Toggle */
  .mode-toggle { display: flex; gap: 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; width: 100%; max-width: 320px; margin-bottom: 20px; }
  .mode-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border: none; border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); font-family: 'Cairo', sans-serif; font-size: 0.88rem; font-weight: 500; cursor: pointer; transition: all 0.3s; }
  .mode-btn.active { background: var(--gold-dim); color: var(--gold); box-shadow: 0 0 20px rgba(212,168,83,0.08); }
  .mode-btn:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.03); }

  /* City Section */
  .city-section, .postal-section { width: 100%; max-width: 320px; display: none; }
  .city-section.active, .postal-section.active { display: block; animation: fadeIn 0.3s ease; }
  .postal-section { display: none; flex-direction: column; gap: 12px; }
  .postal-section.active { display: flex; }
  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }
  .search-input { width: 100%; padding: 14px 14px 14px 40px; background: var(--bg-card); border: 1.5px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: 'Cairo', sans-serif; font-size: 0.9rem; outline: none; transition: all 0.3s; }
  .search-input::placeholder { color: var(--text-dim); }
  .search-input:focus { border-color: var(--gold); background: rgba(212,168,83,0.03); box-shadow: 0 0 0 3px rgba(212,168,83,0.08); }
  .city-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 280px; overflow-y: auto; padding-right: 4px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
  .city-grid::-webkit-scrollbar { width: 4px; }
  .city-grid::-webkit-scrollbar-track { background: transparent; }
  .city-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  .city-chip { padding: 12px 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xs); color: var(--text-muted); font-family: 'Cairo', sans-serif; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.25s; text-align: center; }
  .city-chip:hover { border-color: rgba(255,255,255,0.12); color: var(--text); background: var(--bg-card-hover); }
  .city-chip.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); font-weight: 600; }
  .no-results { grid-column: 1 / -1; text-align: center; color: var(--text-dim); font-size: 0.85rem; padding: 16px; }

  /* GPS Button */
  .gps-btn { display: flex; align-items: center; gap: 10px; margin-top: 20px; padding: 12px 20px; background: transparent; border: 1px dashed rgba(91,164,164,0.3); border-radius: var(--radius-sm); color: var(--teal); font-family: 'Cairo', sans-serif; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.3s; }
  .gps-btn:hover { border-color: var(--teal); background: var(--teal-dim); }

  /* Footer */
  .step-footer { padding: 8px 0 16px; display: flex; justify-content: center; }
  .btn-primary { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 320px; padding: 15px 32px; background: linear-gradient(135deg, var(--gold), #c49840); border: none; border-radius: var(--radius); color: #0a0a0f; font-family: 'Cairo', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 4px 20px rgba(212,168,83,0.25); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(212,168,83,0.35), 0 0 0 3px rgba(212,168,83,0.1); }
  .btn-primary:active { transform: translateY(0); }
  .btn-start { margin-top: 8px; padding: 14px 40px !important; font-size: 1rem !important; }

  /* Spinner */
  .spinner { width: 20px; height: 20px; border: 2.5px solid var(--border); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error */
  .error-msg { margin-top: 12px; padding: 10px 16px; background: rgba(220,60,60,0.08); border: 1px solid rgba(220,60,60,0.2); border-radius: var(--radius-xs); color: #e07070; font-size: 0.82rem; text-align: center; width: 100%; max-width: 320px; display: none; }
  .error-msg.show { display: block; animation: fadeIn 0.3s ease; }

  /* Responsive */
  @media (max-height: 700px) { .title { font-size: 1.8rem; } .step { padding: 12px 16px; } .city-grid { max-height: 180px; } .welcome-crescent svg { width: 48px; height: 48px; } }
  @media (max-width: 380px) { .container { padding: 0 8px; } .title { font-size: 2rem; } .lang-grid { gap: 10px; } }
</style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="pattern-wrap">
  <svg class="pattern-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="islamic-geo" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
        <polygon points="50,5 61,30 90,30 68,48 76,75 50,60 24,75 32,48 10,30 39,30" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.3" />
        <polygon points="50,18 65,25 72,40 72,58 65,73 50,80 35,73 28,58 28,40 35,25" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.15" />
        <line x1="0" y1="0" x2="50" y2="5" stroke="currentColor" stroke-width="0.2" opacity="0.1" />
        <line x1="100" y1="0" x2="50" y2="5" stroke="currentColor" stroke-width="0.2" opacity="0.1" />
        <line x1="0" y1="100" x2="24" y2="75" stroke="currentColor" stroke-width="0.2" opacity="0.1" />
        <line x1="100" y1="100" x2="76" y2="75" stroke="currentColor" stroke-width="0.2" opacity="0.1" />
      </pattern>
    </defs>
    <rect width="400" height="400" fill="url(#islamic-geo)" />
  </svg>
</div>
<div class="particles" id="particles"></div>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<div class="container">

  <!-- STEP 0: Welcome -->
  <div class="step welcome active" id="step-welcome">
    <div class="welcome-content">
      <div class="welcome-crescent">
        <svg width="64" height="64" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="crescent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#d4a853" />
              <stop offset="100%" stop-color="#f0d78c" />
            </linearGradient>
            <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
          </defs>
          <path d="M55 10 C30 10, 10 30, 10 55 C10 80, 30 100, 55 100 C35 90, 25 70, 25 50 C25 30, 35 15, 55 10 Z" fill="url(#crescent-grad)" filter="url(#glow)" />
          <circle cx="72" cy="25" r="2.5" fill="#f0d78c" opacity="0.9"><animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite" /></circle>
          <circle cx="80" cy="40" r="1.5" fill="#f0d78c" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite" /></circle>
          <circle cx="68" cy="50" r="1" fill="#f0d78c" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.5s" repeatCount="indefinite" /></circle>
        </svg>
      </div>
      <h1 class="title">بِسْمِ ٱللَّهِ</h1>
      <div class="divider"><div class="divider-line"></div><div class="divider-diamond"></div><div class="divider-line"></div></div>
      <p class="subtitle">مواقيت الصلاة</p>
      <p class="desc">رفيقك اليومي لمواقيت الصلاة والذكر والرقية</p>
      <button class="btn-primary btn-start" onclick="goTo('lang')">
        <span>ابدأ</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7" /></svg>
      </button>
      <p class="version">الإعداد السريع</p>
    </div>
  </div>

  <!-- STEP 1: Language -->
  <div class="step" id="step-lang">
    <div class="step-header">
      <button class="back-btn" onclick="goTo('welcome')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
      </button>
      <div class="step-indicator">
        <div class="step-dot active"></div>
        <div class="step-line"></div>
        <div class="step-dot"></div>
      </div>
    </div>
    <div class="step-content">
      <div class="step-icon-wrap">
        <div class="icon-circle">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5">
            <circle cx="12" cy="12" r="10" />
            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
          </svg>
        </div>
      </div>
      <h2 class="step-title">اختر لغتك</h2>
      <p class="step-desc">Select your preferred language</p>
      <div class="lang-grid">
        <button class="lang-card active" onclick="selectLang(this)">
          <span class="lang-native">العربية</span>
          <span class="lang-sub">Arabic</span>
          <div class="lang-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0f" stroke-width="3"><path d="M20 6L9 17l-5-5" /></svg></div>
        </button>
        <button class="lang-card" onclick="selectLang(this)">
          <span class="lang-native">English</span>
          <span class="lang-sub">English</span>
          <div class="lang-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0f" stroke-width="3"><path d="M20 6L9 17l-5-5" /></svg></div>
        </button>
        <button class="lang-card" onclick="selectLang(this)">
          <span class="lang-native">Español</span>
          <span class="lang-sub">Spanish</span>
          <div class="lang-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0f" stroke-width="3"><path d="M20 6L9 17l-5-5" /></svg></div>
        </button>
      </div>
    </div>
    <div class="step-footer">
      <button class="btn-primary" onclick="goTo('location')">
        <span>التالي</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7" /></svg>
      </button>
    </div>
  </div>

  <!-- STEP 2: Location -->
  <div class="step" id="step-location">
    <div class="step-header">
      <button class="back-btn" onclick="goTo('lang')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
      </button>
      <div class="step-indicator">
        <div class="step-dot completed">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5" /></svg>
        </div>
        <div class="step-line filled"></div>
        <div class="step-dot active"></div>
      </div>
    </div>
    <div class="step-content">
      <div class="step-icon-wrap">
        <div class="icon-circle teal">
          <svg width="36" height="36" viewBox="0 0 100 100">
            <defs>
              <linearGradient id="pin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#5ba4a4" />
                <stop offset="100%" stop-color="#8ec8c8" />
              </linearGradient>
              <filter id="pin-glow"><feGaussianBlur stdDeviation="2" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
            </defs>
            <path d="M50 10 C30 10, 15 27, 15 45 C15 70, 50 92, 50 92 C50 92, 85 70, 85 45 C85 27, 70 10, 50 10 Z" fill="none" stroke="url(#pin-grad)" stroke-width="3" filter="url(#pin-glow)" />
            <circle cx="50" cy="43" r="12" fill="none" stroke="url(#pin-grad)" stroke-width="2" />
            <circle cx="50" cy="43" r="4" fill="#5ba4a4" opacity="0.8" />
          </svg>
        </div>
      </div>
      <h2 class="step-title">موقعك</h2>
      <p class="step-desc">لحساب مواقيت الصلاة بدقة</p>

      <div class="mode-toggle">
        <button class="mode-btn active" onclick="switchMode('city', this)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /></svg>
          <span>المدينة</span>
        </button>
        <button class="mode-btn" onclick="switchMode('postal', this)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2" /><path d="M2 8l10 5 10-5" /></svg>
          <span>الرمز البريدي</span>
        </button>
      </div>

      <div class="city-section active" id="city-section">
        <div class="search-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon"><circle cx="11" cy="11" r="8" /><path d="M21 21l-4.35-4.35" /></svg>
          <input type="text" class="search-input" placeholder="ابحث عن مدينتك..." id="city-search" oninput="filterCities()">
        </div>
        <div class="city-grid" id="city-grid"></div>
      </div>

    p.className = 'particle';
    const size = Math.random() * 3 + 1;
    p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--p-opacity:${Math.random()*0.3+0.05};animation-duration:${Math.random()*8+12}s;animation-delay:${Math.random()*5}s;`;

  }

  // Populate city grid
  function renderCities(list) {
    const grid = document.getElementById('city-grid');
    grid.innerHTML = '';
    list.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'city-chip';
      btn.textContent = c.name;
      btn.onclick = function() {
        grid.querySelectorAll('.city-chip').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      };
      grid.appendChild(btn);
    });
    if (list.length === 0) grid.innerHTML = '<div class="no-results">لا توجد نتائج</div>';
  }
  renderCities(sampleCities);

  function filterCities() {
    const q = document.getElementById('city-search').value;
    renderCities(sampleCities.filter(c => c.name.includes(q)));
  }

  // Navigation
  function goTo(step) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    if (step === 'welcome') document.getElementById('step-welcome').classList.add('active');
    else if (step === 'lang') document.getElementById('step-lang').classList.add('active');
    else if (step === 'location') document.getElementById('step-location').classList.add('active');

  function selectLang(el) {
    el.closest('.lang-grid').querySelectorAll('.lang-card').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  }

  // Mode toggle
  function switchMode(mode, btn) {
    btn.closest('.mode-toggle').querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('city-section').classList.toggle('active', mode === 'city');
